button{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3ddc84,#1c8f57);display:grid;place-items:center;font-weight:800;color:#06140c;flex:none}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.02em}.top small{display:block;color:var(--sub);font-size:12px}

.ic svg{width:17px;height:17px;fill:none;stroke:var(--fg);stroke-width:1.8}.ic.on{border-color:var(--acc)}.ic.on svg{stroke:var(--acc)}.ib{font:700 15px Georgia,serif}
main{padding-block:0 96px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}

function model(dots){const M=D.model;return '<svg viewBox="0 0 340 170" class="msvg"><path d="'+M.curve+'" fill="none" stroke="#2f3a55" stroke-width="7" stroke-linecap="round"/>'+
  '<line x1="'+M.trend[0]+'" y1="'+M.trend[1]+'" x2="'+M.trend[2]+'" y2="'+M.trend[3]+'" stroke="#56607e" stroke-dasharray="4 4"/>'+
  M.labels.map(l=>'<text x="'+l[0]+'" y="'+l[1]+'" class="hs" text-anchor="middle">'+l[2]+'</text>').join('')+(dots||'')+'</svg>';}
function heroDots(ks){const seen={};return ks.map((k,n)=>{const i=by[k],p=D.model.pos[i.st],c=seen[i.st]=(seen[i.st]||0)+1;
  return '<circle cx="'+p[0]+'" cy="'+(p[1]-(c-1)*19)+'" r="8" fill="'+i.col+'" stroke="#0b0e14" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]-(c-1)*19+3.6)+'" class="hn" text-anchor="middle">'+(n+1)+'</text>';}).join('');}
const add=(t,label)=>'<button class="add" data-pick="'+t+'">＋ '+label+'</button><p class="hint">꾹 눌러서 끌면 순서가 바뀌어요</p>';
const tgts=()=>ls('tgts')||{};
function tgtOf(i){const t=tgts()[i.k];return t>0?t:(i.ap||0);}
function barCard(k){const i=by[k],t=tgtOf(i),c=i.cl.slice(-26),hi=c.length?Math.max(...c,i.npv):i.npv;
  const fill=t&&hi>t?Math.max(0,Math.min(1,(hi-i.npv)/(hi-t))):0,gap=t?t/i.npv-1:0,own=tgts()[k]>0;
  const gc=fill>=1?'#1fb866':'hsl('+Math.round(fill*120)+',85%,55%)';
  return '<article class="card bar" data-k="'+esc(k)+'"><header><h3>'+esc(k)+'</h3>'+chip(i)+'<button class="tg-t" data-tgt="'+esc(k)+'">'+(own?'목표':'좌절 예측치')+' <b>'+fmt(t,i.np)+'</b> ✎</button></header>'+
    '<div class="gauge" style="--gc:'+gc+';--mw:'+(i.np.length+2)+'ch"><i style="width:'+(fill*100).toFixed(1)+'%">'+i.np+'</i></div>'+
    '<p class="meta"><span>6개월 최고 <b>'+fmt(hi,i.np)+'</b></span><span class="r">'+(own?'목표':'좌절 예측치')+'까지 <b>'+pct(gap)+'</b></span></p></article>';}
function paint(){
  const H=list('ha'),cnt={};H.forEach(k=>cnt[by[k].grp]=(cnt[by[k].grp]||0)+1);
  $('[data-tab=ha]').innerHTML='<details class="hero"'+(ls('heroOpen')===false?'':' open')+'><summary><h2>지금 시장은 어디쯤?</h2><span class="sum">'+
    Object.entries(D.groups).filter(([g])=>cnt[g]).map(([g,c])=>'<b style="color:'+c+'">'+g+' '+cnt[g]+'</b>').join(' · ')+'</span></summary>'+model(heroDots(H))+
    '<div class="lg">'+H.map((k,n)=>'<span><i style="background:'+by[k].col+'">'+(n+1)+'</i>'+esc(k)+' <em>'+by[k].stage+'</em></span>').join('')+'</div></details>'+
    '<div class="grid" data-list="ha">'+H.map(k=>{const i=by[k];return '<article class="card" data-k="'+esc(k)+'"><header><h3>'+esc(k)+'</h3>'+chip(i)+'</header><div class="cell">'+i.svg+'</div>'+
      '<p class="meta">'+(i.dd>0?'<span class="ddl">좌절까지 D-'+i.dd+'</span>':'')+(i.ap?'<span class="r">'+(i.az?'바닥 대비':'예측치까지')+' <b>'+pct(i.gp)+'</b></span>':'')+'</p></article>';}).join('')+'</div>'+add('ha','종목 추가');
  $('[data-tab=chart]').innerHTML='<div class="grid" data-list="chart">'+list('chart').map(k=>{const i=by[k];return '<article class="card" data-k="'+esc(k)+'"><header><h3>'+esc(k)+'</h3><span class="px">'+i.np+'</span></header>'+spark(i.cl)+
      '<p class="meta"><span>1주 <b class="'+(i.w1>=0?'up':'dn')+'">'+pct(i.w1)+'</b></span><span class="r">1년 <b class="'+(i.y1>=0?'up':'dn')+'">'+pct(i.y1)+'</b></span></p></article>';}).join('')+'</div>'+add('chart','차트 추가');
  $('[data-tab=bar]').innerHTML='<div class="grid one" data-list="bar">'+list('bar').map(barCard).join('')+'</div>'+add('bar','바 추가');
  $('.hero').addEventListener('toggle',e=>ls('heroOpen',e.target.open));
  $('#bell').classList.toggle('on',Object.values(ls('alerts')||{}).some(Boolean));
}
function go(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===t));document.querySelectorAll('section[data-tab]').forEach(s=>s.hidden=s.dataset.tab!==t);ls('tab',t);scrollTo(0,0);}
function sheet(html){const d=document.createElement('div');d.className='sheet';d.innerHTML='<div><button class="x" aria-label="닫기">×</button>'+html+'</div>';
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('.x,[data-close]'))d.remove();});document.body.appendChild(d);return d;}
function picker(t){let cur=new Set(list(t)),f='all',q='';const names={ha:'하',chart:'차트',bar:'바'};
  const d=sheet('<h2>'+names[t]+'에 보일 것 고르기 <span class="badge">베타 무료</span></h2><input class="srch" id="pq" placeholder="이름 검색" autocomplete="off"><div class="seg"><button data-f="all" class="on">전체</button><button data-f="macro">지표</button><button data-f="kr">한국</button><button data-f="us">미국</button></div><div id="pl"></div><button class="cta" data-close>완료</button>');
  const draw=()=>{d.querySelector('#pl').innerHTML=D.items.filter(i=>(f==='all'||(f==='macro'?i.macro:!i.macro&&((f==='kr')===/\.K[SQ]$/.test(i.sym))))&&(!q||i.k.toLowerCase().includes(q))).map(i=>
    '<label class="row"><span>'+esc(i.k)+' <small>'+i.stage+'</small></span><input type="checkbox" class="tg" data-k="'+esc(i.k)+'"'+(cur.has(i.k)?' checked':'')+'></label>').join('');};
  draw();d.querySelector('#pq').oninput=e=>{q=e.target.value.trim().toLowerCase();draw();};
  d.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;f=b.dataset.f;d.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));draw();};
  d.addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;e.target.checked?cur.add(k):cur.delete(k);const old=list(t);ls('list_'+t,[...old.filter(x=>cur.has(x)),...[...cur].filter(x=>!old.includes(x))]);paint();});}
function detail(k){const i=by[k],seq=D.stages.map((s,j)=>j===i.st?'<u style="--c:'+i.col+'">'+s+'</u>':s).join(' → ');
  sheet('<h2>'+esc(k)+' '+chip(i)+'</h2><div class="cell">'+i.svg+'</div><p class="seq">'+seq+'</p>'+
    '<div class="row"><span>새 논리 고점</span><b>'+(i.pk||'-')+'</b></div><div class="row"><span>좌절 예측치</span><b>'+(i.zz||'-')+'</b></div>'+
    (i.dd>0?'<div class="row"><span>좌절까지</span><b>D-'+i.dd+'</b></div>':'')+'<div class="row"><span>곡선 일치율 <small>(높을수록 모델과 비슷)</small></span><b>'+i.fit+'%</b></div>'+
    '<h4>근거 <span class="badge">베타 무료</span></h4><div class="why">'+(esc(i.why)||'과거 사례 자료가 부족해 단계표로 추정했어요.')+'</div>'+
    '<p style="font-size:12px;color:var(--dim)">좌절 예측치는 지금과 닮은 과거 급락 사례의 중간값이에요. 맞는다는 보장은 없어요.</p>');}
function editTgt(k){const b=document.querySelector('[data-tgt="'+CSS.escape(k)+'"]');if(!b)return;const i=by[k];
  b.outerHTML='<input class="tin" id="tin" inputmode="decimal" placeholder="목표가" value="'+(tgts()[k]||'')+'">';const inp=$('#tin');inp.focus();
  const done=()=>{const v=parseFloat(inp.value.replace(/[^\d.]/g,''));const t=tgts();if(v>0)t[k]=v;else delete t[k];ls('tgts',t);paint();toast(v>0?k+' 목표 '+fmt(v,i.np):k+' 목표 지움 → 좌절 예측치');};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();});inp.addEventListener('blur',done,{once:true});}
function alerts(){const a=ls('alerts')||{};const R=[['stage','단계가 바뀌면 알림','하 탭에 있는 종목 기준'],['d30','좌절까지 D-30 알림',''],['d7','좌절까지 D-7 알림',''],['tgt','바 목표가에 닿으면 알림',''],['weekly','월요일 아침 요약','지난주 단계 변화 한 장']];
  const d=sheet('<h2>알림 <span class="badge">베타 무료</span></h2>'+R.map(([id,t,s])=>'<label class="row"><span>'+t+(s?'<br><small>'+s+'</small>':'')+'</span><input type="checkbox" class="tg" id="al_'+id+'" data-a="'+id+'"'+(a[id]?' checked':'')+'></label>').join('')+
    '<p style="font-size:12px;color:var(--dim)">설정은 저장되지만, 실제 알림 발송은 정식 출시 때 붙어요.</p><button class="cta" data-close>완료</button>');
  d.addEventListener('change',e=>{const id=e.target.dataset.a;if(!id)return;a[id]=e.target.checked;ls('alerts',a);paint();});}
function info(){const u=ls('user');sheet('<h2>사용법</h2>'+
  '<h4>▦ 차트</h4><ul><li>최근 2년 주봉 흐름과 1주·1년 등락이에요. 누르면 하이먼 상세가 열려요.</li></ul>'+
  '<h4>≡ 바</h4><ul><li>6개월 최고가에서 목표가까지 얼마나 왔는지 막대로 보여줘요. 막대가 꽉 차면 목표 도달이에요.</li><li>✎를 눌러 목표가를 정해요. 안 정하면 좌절 예측치가 목표가 돼요.</li></ul>'+
  '<h4>∿ 하</h4><ul><li>초록 곡선은 버블이 생기고 꺼지는 단계 모델이에요. 빨간 선은 실제 주가, <b style="color:var(--warn)">노란 점</b>이 지금이에요.</li>'+
  '<li><b style="color:var(--bad)">빨간 점</b>은 새 논리(고점), <b style="color:var(--acc)">초록 점</b>은 좌절 예측치(과거 비슷한 급락 사례로 추정한 바닥 가격·연월)예요.</li><li>좌절까지 D-는 좌절 예측치 달까지 남은 날이에요. 카드를 누르면 근거가 보여요.</li><li>맨 위 "지금 시장은 어디쯤?"은 눌러서 접을 수 있어요.</li></ul>'+
  '<h4>＋ 추가·순서·알림</h4><ul><li>탭마다 아래 ＋ 버튼으로 지표·대형주 '+D.items.length+'개 중에서 골라요.</li><li>카드를 꾹 눌러 끌면 순서가 바뀌어요. 보고 싶은 걸 맨 위로 올리세요.</li><li>🔔에서 단계 변화·D-day·목표가 알림을 켜요.</li><li>정식 출시 때는 기본 지표만 무료, 추가·알림은 구독(월 5,900원) 예정이에요. 지금은 베타라 다 열려 있어요.</li></ul>'+
  '<div class="row"><span>로그인 <small>'+(u?esc(u)+'로 로그인됨(화면만)':'안 함')+'</small></span><button class="lb g" style="width:auto;padding:8px 12px;font-size:14px" id="logout" data-close>'+(u?'로그아웃':'로그인')+'</button></div>');
  $('#logout').onclick=()=>{ls('user',null);$('#login').hidden=false;};}
// 꾹 눌러 끌어서 순서 바꾸기 (0.45초 누르면 집힘, 그 전에 움직이면 스크롤)
let lp=null,dragEl=null,moved=false,justDragged=0;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.grid .card');if(!c||e.target.closest('button,input'))return;const x0=e.clientX,y0=e.clientY;
  lp={c,x0,y0,t:setTimeout(()=>{dragEl=c;c.classList.add('drag');navigator.vibrate?.(15);},450)};});
document.addEventListener('pointermove',e=>{if(!lp)return;if(!dragEl){if(Math.hypot(e.clientX-lp.x0,e.clientY-lp.y0)>8){clearTimeout(lp.t);lp=null;}return;}
  e.preventDefault();moved=true;const o=document.elementFromPoint(e.clientX,e.clientY)?.closest('.grid .card');const g=dragEl.parentNode;
  if(o&&o!==dragEl&&o.parentNode===g){const a=[...g.children],i=a.indexOf(dragEl),j=a.indexOf(o);g.insertBefore(dragEl,i<j?o.nextSibling:o);}},{passive:false});
document.addEventListener('touchmove',e=>{if(dragEl)e.preventDefault();},{passive:false});
const endDrag=()=>{if(lp)clearTimeout(lp.t);if(dragEl){const g=dragEl.parentNode;dragEl.classList.remove('drag');ls('list_'+g.dataset.list,[...g.children].map(c=>c.dataset.k));if(moved)justDragged=Date.now();dragEl=null;paint();}lp=null;moved=false;};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.grid .card'))e.preventDefault();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-login]');if(b){const u=b.dataset.login;ls('user',u||'');$('#login').hidden=true;if(u)toast(u+' 로그인(베타: 화면만)');if(!ls('seen')){ls('seen',1);setTimeout(info,300);}return;}
  const tg=e.target.closest('[data-tgt]');if(tg)return editTgt(tg.dataset.tgt);
  const p=e.target.closest('[data-pick]');if(p)return picker(p.dataset.pick);
  const c=e.target.closest('.grid .card');if(c&&Date.now()-justDragged>400&&!e.target.closest('input'))return detail(c.dataset.k);});
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.go);};
$('#bell').onclick=alerts;$('#info').onclick=info;
$('#built').textContent='기준 '+D.built+'.';$('#loginArt').innerHTML=model(heroDots(D.defaults.ha));
paint();go(ls('tab')||'chart');if(ls('user')===null)$('#login').hidden=false;
</script>
